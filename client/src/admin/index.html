<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Vypnutí obnovy uuOIDC session při načtení stránky.

      `uu5bricksg01` táhne `uu_appg01` a s ním `uu_appg01_oidc`, který se po načtení sám
      pokusí obnovit session na `uuidentity.plus4u.net` — na veřejném webu fotbalového klubu,
      který se přihlašuje vlastní identitou přes `caio-server-auth`, ne přes Plus4U (a v konzoli
      skončí chyba, protože `client_id` je undefined). Od 2026-11-16 ho žádná stránka nenačítá
      (historie je na `Uu5Extras.VerticalTimeline`, review 2026-11-12, S5), balíček ale zůstává
      kvůli ECC (design/README.md) — tag je pojistka pro první obsah, který ho zase použije.

      Hodnota je **"disabled"**, ne "false": z meta tagu se čte doslovně a porovnává se
      s konstantou `RESTORE_SESSION_DISABLED = "disabled"`. Řetězec "false" je pravdivý,
      takže by se obnova session pustila dál (na "false" reaguje jen globální konfigurace,
      ne tenhle tag).
    -->
    <meta uuAppOidcRestoreSessionOnLoad="disabled" />
    <!--
      POZOR: `uu5g05_libraryLoadDisabled` v `window.uu5Environment` se nastavit NEDÁ.
      Vypne dotaz do uuAppLibraryRegistry (`uuapp.plus4u.net`), kterým si uu5g05 překládá
      jmenný prostor z uu5String na knihovnu — a appka pak skončí na „Unexpected error".
      Ověřeno 7. 9. 2026. Komponenty pro obsah se proto registrují v kódu
      (`Utils.LibraryRegistry.registerComponent`, `routes/page.jsx`); registrovaná komponenta
      se do registru neptá.
    -->
    <title>Administrace · AFK Bratčice</title>
    <!--
      Administrace je vlastní UVE: vlastní dokument, bundle (admin.js) a kus URL -- server tímhle
      dokumentem odpovídá na /admin a všechno pod ním. Návštěvník webu kód administrace ani její
      knihovny nestahuje. Routy uvnitř jsou bez `admin/` (`clubs`, `matches`); `noindex` jí dá
      devkit (caio.config.js `uves.admin`).
    -->
    <!--
      Zbytek hlavičky doplní caio-devkit (plugins/document.js): <base> s app base, skript
      světlého/tmavého režimu, boot screen, titulek a `lang` z caio.config.js (`boot`, `name`,
      `languages`, barvy z `theme`) a SEO hlavičku.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.jsx"></script>
  </body>
</html>
